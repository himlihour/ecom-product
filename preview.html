    // Spider Web & Cursor Spotlight & Click Wave Background Component
    function SpiderWebBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const mouse = { x: null, y: null, radius: 170 };

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        // Click waves / shockwaves
        const ripples = [];
        const handleClick = (e) => {
          ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 0,
            maxRadius: 230,
            alpha: 1,
            speed: 5
          });
        };
        window.addEventListener('click', handleClick);

        // Spiderweb particles
        const particleCount = Math.min(Math.floor((width * height) / 13000), 80);
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7,
            radius: Math.random() * 2 + 1,
            color: Math.random() > 0.4 ? 'rgba(16, 185, 129, ' : 'rgba(148, 163, 184, '
          });
        }

        const animate = () => {
          ctx.clearRect(0, 0, width, height);

          // 1. Mouse Cursor Spotlight Light
          if (mouse.x !== null && mouse.y !== null) {
            const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 280);
            gradient.addColorStop(0, 'rgba(16, 185, 129, 0.09)');
            gradient.addColorStop(0.5, 'rgba(16, 185, 129, 0.03)');
            gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 280, 0, Math.PI * 2);
            ctx.fill();
          }

          // 2. Click Shockwave Waves
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += r.speed;
            r.alpha -= 0.02;

            if (r.alpha <= 0 || r.radius >= r.maxRadius) {
              ripples.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(16, 185, 129, ${r.alpha * 0.8})`;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 14;
            ctx.stroke();

            if (r.radius > 20) {
              ctx.beginPath();
              ctx.arc(r.x, r.y, r.radius - 16, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(52, 211, 153, ${r.alpha * 0.4})`;
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }
            ctx.restore();
          }

          // 3. Particles & Spider Web Network
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx = -p.vx;
            if (p.y < 0 || p.y > height) p.vy = -p.vy;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color + '0.75)';
            ctx.fill();

            // Connect nearby nodes
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 130) {
                const alpha = (1 - dist / 130) * 0.22;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(16, 185, 129, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }

            // Connect to mouse cursor like a spider web
            if (mouse.x !== null && mouse.y !== null) {
              const mdx = p.x - mouse.x;
              const mdy = p.y - mouse.y;
              const mdist = Math.sqrt(mdx * mdx + mdy * mdy);

              if (mdist < mouse.radius) {
                const malpha = (1 - mdist / mouse.radius) * 0.5;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = `rgba(52, 211, 153, ${malpha})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('click', handleClick);
        };
      }, []);

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-0" 
          style={{ background: 'transparent' }}
        />
      );
    }

    // Core Products Data
    const PRODUCTS = [
      {

        price: 650.00,

        price: 15.00,

        reviews: 89,
        image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=700&auto=format&fit=crop&q=80",
        tag: "Essential"
      },
      {
        id: 3,
        name: "Keyboard",
        category: "Peripherals",
        sku: "HW-KB-025",
        price: 25.00,
        rating: 4.8,
        reviews: 215,
        image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=700&auto=format&fit=crop&q=80",
        tag: "Developer Choice"

      {

        image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=700&auto=format&fit=crop&q=80",
        tag: "Reference Display"
      }

    const SHIPPING_METHODS = [
      { 
        id: 'free', 
        name: 'Standard Ground Delivery', 
        price: 0.00, 
        duration: '7 - 20 Business Days', 
        carrier: 'Postal Freight Network',
        desc: 'Fully tracked standard shipment with delivery confirmation.' 
      },
      { 
        id: 'express', 
        name: 'Priority Express Delivery', 
        price: 9.00, 
        duration: '1 - 3 Business Days', 
        carrier: 'Global Air Cargo',
        desc: 'Guaranteed rapid air courier with real-time checkpoint telemetry.' 
      }
    ];

    function App() {
      const [currentStep, setCurrentStep] = useState('products');
      const [cart, setCart] = useState([]);
      const [completedOrder, setCompletedOrder] = useState(null);
      const [isCartBumping, setIsCartBumping] = useState(false);

      const [formData, setFormData] = useState({
        firstName: '',
        lastName: '',
        email: '',
        phone: '',
        street: '',
        city: '',
        state: '',
        zipCode: '',
        shippingMethod: 'free'
      });
      const [errors, setErrors] = useState({});

      const handleAddToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(p => p.id === product.id);
          if (exists) {
            return prev.map(p => p.id === product.id ? { ...p, quantity: p.quantity + 1 } : p);
          }
          return [...prev, { ...product, quantity: 1 }];
        });

        // Trigger Cart Box Animation
        setIsCartBumping(true);
        setTimeout(() => setIsCartBumping(false), 500);
      };

      const handleUpdateQty = (id, delta) => {
        setCart(prev => prev.map(p => {
          if (p.id === id) {
            const next = p.quantity + delta;
            return next >= 1 ? { ...p, quantity: next } : p;
          }
          return p;
        }));
      };

      const handleRemoveItem = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
      };

      const subtotal = useMemo(() => cart.reduce((sum, i) => sum + (i.price * i.quantity), 0), [cart]);
      const selectedShipping = SHIPPING_METHODS.find(m => m.id === formData.shippingMethod) || SHIPPING_METHODS[0];
      const shippingCost = selectedShipping.price;
      const grandTotal = subtotal + shippingCost;
      const cartCount = useMemo(() => cart.reduce((sum, i) => sum + i.quantity, 0), [cart]);

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        const errs = {};
        if (!formData.firstName.trim()) errs.firstName = "First name is required";
        if (!formData.lastName.trim()) errs.lastName = "Last name is required";
        if (!formData.email.trim()) {
          errs.email = "Email address is required";
        } else if (!/\S+@\S+\.\S+/.test(formData.email)) {
          errs.email = "Invalid email formatting";
        }
        if (!formData.phone.trim()) errs.phone = "Phone number is required";
        if (!formData.street.trim()) errs.street = "Street address is required";
        if (!formData.city.trim()) errs.city = "City is required";
        if (!formData.state.trim()) errs.state = "State / Province is required";
        if (!formData.zipCode.trim()) errs.zipCode = "Zip code is required";

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        if (cart.length === 0) return;

        const newOrder = {
          orderId: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
          customerName: `${formData.firstName} ${formData.lastName}`,
          customerEmail: formData.email,
          customerPhone: formData.phone,
          customerAddress: `${formData.street}, ${formData.city}, ${formData.state} ${formData.zipCode}`,
          orderDate: new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }),
          products: [...cart],
          subtotal,
          shippingCost,
          shippingMethodName: selectedShipping.name,
          grandTotal,
          status: "Pending"
        };

        setCompletedOrder(newOrder);
        setCart([]);
        setCurrentStep('confirmation');
      };

      const steps = [
        { id: 'products', num: '01', label: 'CATALOG' },
        { id: 'cart', num: '02', label: `CART (${cartCount})` },
        { id: 'checkout', num: '03', label: 'CHECKOUT' },
        { id: 'confirmation', num: '04', label: 'CONFIRMATION' },
      ];

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans relative">
          
          {/* Interactive Spider Web & Mouse Follow Light & Wave Background */}
          <SpiderWebBackground />

          {/* Navigation with Animated Cart */}
          <header className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div 
                onClick={() => setCurrentStep('products')} 
                className="flex items-center gap-3 cursor-pointer group select-none"
              >
                <div className="h-9 w-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:bg-emerald-500/20 group-hover:border-emerald-500/50 transition">
                  <span className="font-mono text-sm font-bold tracking-tighter">&gt;_</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-bold tracking-tight text-white font-mono">
                      Kiro<span className="text-emerald-400">.Shop</span>
                    </span>
                  </div>
                </div>
              </div>

              {/* Stepper */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/90 border border-slate-800/80 px-2 py-1 rounded-lg">
                {steps.map((s, idx) => {
                  const isActive = currentStep === s.id;
                  const isClickable = s.id === 'products' || (s.id === 'cart' && cartCount >= 0) || (s.id === 'checkout' && cartCount > 0);
                  return (
                    <React.Fragment key={s.id}>
                      {idx > 0 && <span className="text-slate-700 text-xs px-1">/</span>}
                      <button
                        onClick={() => isClickable && setCurrentStep(s.id)}
                        disabled={!isClickable}
                        className={`flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded transition ${
                          isActive
                            ? 'bg-emerald-500 text-slate-950 font-bold shadow-sm'
                            : isClickable
                            ? 'text-slate-400 hover:text-slate-200'
                            : 'text-slate-600 cursor-not-allowed'
                        }`}
                      >
                        <span className={isActive ? 'text-slate-950 font-bold' : 'text-slate-500'}>{s.num}</span>
                        <span>{s.label}</span>
                      </button>
                    </React.Fragment>
                  );
                })}
              </nav>

              {/* Cart Box with Dynamic Animation */}
              <button 
                onClick={() => setCurrentStep('cart')}
                className={`flex items-center gap-3 px-3.5 py-2 rounded-lg bg-slate-900 border transition duration-300 ${
                  isCartBumping 
                    ? 'scale-110 border-emerald-400 bg-slate-800 shadow-lg shadow-emerald-500/30' 
                    : 'border-slate-800 hover:border-emerald-500/40 text-slate-300'
                }`}
              >
                <div className="relative">
                  <IconShoppingBag className={`w-4 h-4 transition ${isCartBumping ? 'text-emerald-400 scale-110' : 'text-slate-400'}`} />
                  {cartCount > 0 && (
                    <span className={`absolute -top-1.5 -right-2 bg-emerald-500 text-slate-950 font-mono text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center transition ${
                      isCartBumping ? 'scale-125 bg-emerald-400' : ''
                    }`}>
                      {cartCount}
                    </span>
                  )}
                </div>
                <span className="text-xs font-mono text-slate-300 font-semibold hidden sm:inline">
                  ${subtotal.toFixed(2)}
                </span>
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 relative z-10">
            
            {/* 1. Products View */}
            {currentStep === 'products' && (
              <div className="space-y-8">

                  <h1 className="text-2xl sm:text-3xl font-bold tracking-tight text-white font-sans">

                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                  {PRODUCTS.map(product => {
                    const inCartItem = cart.find(c => c.id === product.id);
                    return (
                      <div 
                        key={product.id}
                        className="bg-slate-900/60 backdrop-blur-sm border border-slate-800 rounded-xl overflow-hidden flex flex-col hover:border-slate-700 hover:bg-slate-900/90 transition duration-200 group shadow-lg"
                      >
                        <div className="relative h-48 bg-slate-950 overflow-hidden border-b border-slate-800/80">
                          <img 
                            src={product.image} 
                            alt={product.name}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 opacity-85 group-hover:opacity-100"
                          />
                          <div className="absolute top-3 left-3 flex gap-2">
                            <span className="bg-slate-950/90 border border-slate-800 text-slate-300 font-mono text-[10px] px-2 py-0.5 rounded">
                              {product.sku}
                            </span>
                          </div>
                          <div className="absolute top-3 right-3">
                            <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono text-[10px] font-semibold px-2 py-0.5 rounded">
                              {product.tag}
                            </span>
                          </div>
                        </div>

                        <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                          <div>
                            <div className="flex items-center justify-between text-xs mb-1.5">
                              <span className="font-mono text-slate-400 text-[11px] uppercase tracking-wider">

                      <span className="text-[11px] text-slate-300 block">{completedOrder.orderDate}</span>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-500 uppercase block tracking-wider">Order Status</span>
                      <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/10 border border-amber-500/20 text-amber-400">
                        <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                        {completedOrder.status}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900/60 backdrop-blur-sm border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                    <div className="flex items-center gap-2">
                      <IconPackage className="w-4 h-4 text-emerald-400" />
                      <h3 className="text-sm font-bold text-white font-mono uppercase tracking-wider">
                        Ordered Products Ledger
                      </h3>
                    </div>
                    <span className="text-xs font-mono text-slate-400">
                      {completedOrder.products.length} Units Manifested
                    </span>
                  </div>

                  <div className="divide-y divide-slate-800/80">
                    {completedOrder.products.map(item => (
                      <div key={item.id} className="py-3.5 first:pt-0 last:pb-0 flex items-center justify-between gap-4">
                        <div className="flex items-center gap-3.5">
                          <img src={item.image} alt={item.name} className="w-12 h-12 rounded-lg object-cover bg-slate-950 border border-slate-800 shrink-0" />
                          <div>
                            <h4 className="text-xs font-bold font-mono text-white">{item.name}</h4>
                            <p className="text-[11px] text-slate-400 font-mono mt-0.5">
                              ${item.price.toFixed(2)} × {item.quantity}
                            </p>
                          </div>
                        </div>
                        <div className="text-right">
                          <span className="text-xs font-bold font-mono text-white">
                            ${(item.price * item.quantity).toFixed(2)}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="border-t border-slate-800/80 pt-4 space-y-2 text-xs font-mono">
                    <div className="flex justify-between text-slate-400">
                      <span>SUBTOTAL</span>
                      <span className="text-white">${completedOrder.subtotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-slate-400">
                      <span>LOGISTICS ({completedOrder.shippingMethodName})</span>
                      <span className="text-white">
                        {completedOrder.shippingCost === 0 ? 'FREE' : `$${completedOrder.shippingCost.toFixed(2)}`}
                      </span>
                    </div>
                    <div className="border-t border-slate-800 pt-3 flex justify-between items-baseline">
                      <span className="text-xs font-bold text-white font-sans">TOTAL AMOUNT</span>
                      <span className="text-xl font-bold font-mono text-emerald-400">
                        ${completedOrder.grandTotal.toFixed(2)}
                      </span>
                    </div>
                  </div>

                  <div className="bg-slate-950 rounded-lg p-3.5 border border-slate-800 text-xs font-mono text-slate-400 space-y-1">
                    <span className="text-[10px] text-slate-500 uppercase tracking-widest block font-bold">DISPATCH TARGET</span>
                    <p className="text-slate-200">{completedOrder.customerAddress}</p>
                    <p className="text-slate-400">Contact: {completedOrder.customerPhone}</p>
                  </div>

                  <div className="pt-2 flex flex-col sm:flex-row gap-3">
                    <button 
                      onClick={() => {
                        setCompletedOrder(null);
                        setCurrentStep('products');
                      }}
                      className="flex-1 py-3 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-mono font-bold text-xs flex items-center justify-center gap-2 transition"
                    >
                      <span>NEW ORDER / CONTINUE</span>
                      <IconArrowRight className="w-3.5 h-3.5" />
                    </button>
                    <button 
                      onClick={() => window.print()}
                      className="px-5 py-3 rounded-lg bg-slate-950 hover:bg-slate-900 text-slate-300 font-mono text-xs border border-slate-800 transition flex items-center justify-center gap-2"
                    >
                      <IconPrinter className="w-3.5 h-3.5" />
                      <span>PRINT RECEIPT</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950/80 backdrop-blur-sm py-8 text-xs font-mono text-slate-500 relative z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-emerald-400 font-bold">Kiro.Shop</span>
                <span>/ API-GRADE PRODUCT SYSTEM</span>
              </div>
              <p className="text-slate-600">Procurement & Fulfillment Architecture</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
